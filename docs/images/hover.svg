  <rect x="1" y="1" width="458" height="148" rx="14" fill="#1c2129" stroke="#2e3540" stroke-width="2"/>
  <rect x="40" y="24" width="380" height="102" rx="8" fill="#000000" fill-opacity="0.45"/>
  <g font-size="16" text-anchor="middle">
