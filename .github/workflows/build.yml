name: Build

# Every push builds the mod and keeps the zip as a downloadable artifact.
# To publish a release: Actions -> Build -> Run workflow, and enter a version.
# The release goes to Hexium first (when set up, see docs/DEVELOPMENT.md), then to GitHub Releases.
# Tick "Experimental" to publish a GitHub pre-release from any branch instead; it never goes to Hexium.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0. Leave empty to build without releasing.'
        required: false
        default: ''
      hexium:
        description: 'Also publish the release to Hexium'
        type: boolean
        default: true
      experimental:
        description: 'Experimental: GitHub pre-release only, from any branch, never to Hexium'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Free Valheim dedicated server; it ships the same game assemblies the mod compiles against.
  VALHEIM_SERVER_APP_ID: '896660'
  BEPINEX_PACK_VERSION: '5.4.2202'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check release version
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EXPERIMENTAL" != "true" ] && [ "$GITHUB_REF_NAME" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::Stable releases come from the default branch only (this is '$GITHUB_REF_NAME'). Tick 'Experimental' to release this branch as a pre-release."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$VERSION')."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Pick a higher version."
            exit 1
          fi

      - name: Download Valheim dedicated server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lib32gcc-s1 >/dev/null
          mkdir -p "$RUNNER_TEMP/steamcmd" && cd "$RUNNER_TEMP/steamcmd"
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar zxf -
          VALHEIM="$RUNNER_TEMP/valheim"
          # SteamCMD sometimes exits early while updating itself; retry until the game assembly is there.
          for attempt in 1 2 3; do
            ./steamcmd.sh +force_install_dir "$VALHEIM" +login anonymous +app_update "$VALHEIM_SERVER_APP_ID" validate +quit || true
            [ -f "$VALHEIM/valheim_server_Data/Managed/assembly_valheim.dll" ] && break
          done
          test -f "$VALHEIM/valheim_server_Data/Managed/assembly_valheim.dll"
          echo "VALHEIM_INSTALL=$VALHEIM" >> "$GITHUB_ENV"
          echo "VALHEIM_MANAGED=$VALHEIM/valheim_server_Data/Managed" >> "$GITHUB_ENV"

      - name: Download BepInExPack
        run: |
          mkdir -p "$RUNNER_TEMP/bepinex" && cd "$RUNNER_TEMP/bepinex"
          curl -fsSL -o pack.zip "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/$BEPINEX_PACK_VERSION/"
          unzip -q pack.zip
          CORE_DLL=$(find "$PWD" -path '*/BepInEx/core/BepInEx.dll' | head -1)
          test -n "$CORE_DLL"
          echo "BEPINEX_PATH=$(dirname "$(dirname "$CORE_DLL")")" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION_ARG=()
          [ -n "$VERSION" ] && VERSION_ARG=("-p:Version=$VERSION")
          dotnet build BenchNetwork/BenchNetwork.csproj -c Release \
            "-p:VALHEIM_INSTALL=$VALHEIM_INSTALL" \
            "-p:VALHEIM_MANAGED=$VALHEIM_MANAGED" \
            "-p:BEPINEX_PATH=$BEPINEX_PATH" \
            "${VERSION_ARG[@]}"
          ZIP=$(ls BenchNetwork/bin/Release/BenchNetwork-*.zip)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          unzip -l "$ZIP"

      # The mod compiles against a publicized game where everything is public; this catches members that are
      # private in the real game and would throw FieldAccessException in game.
      - name: Check game members are accessible
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          dotnet tool install -g ilspycmd --version 8.2.0.7535 >/dev/null
          python3 tools/check_game_members.py "$VALHEIM_MANAGED"/assembly_valheim.dll "$VALHEIM_MANAGED"/assembly_*.dll

      # TEMPORARY research step: member names only, no game code.
      - name: List shield generator members
        env:
          DOTNET_ROLL_FORWARD: Major
        run: python3 tools/list_members.py ShieldGenerator,ShieldDomeImageEffect "$VALHEIM_MANAGED"/assembly_valheim.dll "$VALHEIM_MANAGED"/assembly_*.dll

      - uses: actions/upload-artifact@v4
        with:
          name: BenchNetwork
          path: ${{ env.ZIP }}

  # Runs on its own, with read-only access, so the third-party upload action only sees the Hexium token.
  # Skipped until the HEXIUM_TEAM repository variable is set (see docs/DEVELOPMENT.md).
  hexium:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && inputs.hexium && !inputs.experimental && vars.HEXIUM_TEAM != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check Hexium token
        env:
          HAS_TOKEN: ${{ secrets.HEXIUM_AUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::HEXIUM_TEAM is set but the HEXIUM_AUTH_TOKEN secret is missing (see docs/DEVELOPMENT.md)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: BenchNetwork
          path: package

      - name: Find package
        run: echo "ZIP=$(ls package/BenchNetwork-*.zip)" >> "$GITHUB_ENV"

      - name: Publish to Hexium
        id: publish
        uses: Klastic/publish-to-hexium@v1
        with:
          token: ${{ secrets.HEXIUM_AUTH_TOKEN }}
          package: ${{ env.ZIP }}
          author-name: ${{ vars.HEXIUM_TEAM }}
          community-categories: '{"valheim": ["Mods", "Client & Server"]}'

      - name: Report Hexium result
        env:
          HIDDEN: ${{ steps.publish.outputs.hidden }}
        run: |
          if [ "$HIDDEN" = "true" ]; then
            echo "::warning::Hexium accepted the upload but the package is hidden for now (for example while it is reviewed)."
          else
            echo "Published to Hexium."
          fi

  release:
    needs: [build, hexium]
    # Still release on GitHub when the Hexium job was skipped, but not when it failed.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.version != '' &&
      needs.build.result == 'success' &&
      (needs.hexium.result == 'success' || needs.hexium.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BenchNetwork
          path: package

      - name: Publish GitHub release
        env:
          VERSION: ${{ inputs.version }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA=()
          TITLE="BenchNetwork $VERSION"
          if [ "$EXPERIMENTAL" = "true" ]; then
            # Pre-releases don't count as "latest", so players and the README's download link keep the stable one.
            EXTRA=(--prerelease --notes "Experimental build from \`$GITHUB_REF_NAME\` for testing. Not for general use.")
            TITLE="BenchNetwork $VERSION (experimental)"
          else
            EXTRA=(--generate-notes)
          fi
          gh release create "v$VERSION" package/BenchNetwork-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            "${EXTRA[@]}"
